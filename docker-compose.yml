# Nihongo Graph — FalkorDB + app (+ optional GraphRAG-SDK sidecar).
#   docker compose up --build                  # demo mode, no LLM key needed
#   docker compose --profile graphrag up --build   # also start the optional Python GraphRAG sidecar
#
# FalkorDB image: falkordb/falkordb (server + FalkorDB Browser on :3000), as in
# https://docs.falkordb.com/operations/docker . The tag is pinned (override with FALKORDB_IMAGE);
# use falkordb/falkordb-server for a server-only production image.
services:
  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:v4.18.9}
    container_name: nihongo-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"   # Redis protocol: host 6380 -> container's own 6379 (loopback only)
      - "127.0.0.1:3000:3000"                      # FalkorDB Browser UI
    environment:
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      # --dir pins Redis' data directory to the mounted volume (the docs mention two different paths),
      # so persistence does not depend on the image's default. AOF keeps every write durable.
      REDIS_ARGS: "--dir /data --appendonly yes --appendfsync everysec ${FALKORDB_PASSWORD:+--requirepass ${FALKORDB_PASSWORD}}"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$FALKORDB_PASSWORD\" ]; then redis-cli -a \"$$FALKORDB_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: nihongo-app
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "${PORT:-3002}:3002"
    environment:
      PORT: "3002"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"   # container-to-container: the image's internal port (host port is 6380)
      FALKORDB_USERNAME: ${FALKORDB_USERNAME:-}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      FALKORDB_TLS: ${FALKORDB_TLS:-0}   # 1 = encrypted connection (needs FALKORDB_HOST pointing at a TLS database)
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-nihongo}
      AUTO_BOOTSTRAP: ${AUTO_BOOTSTRAP:-1}   # create schema, ingest resources/, seed the demo learner
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}   # how long a learner sign-in lasts
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # set to 1 when the app is served over HTTPS
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GRAPHRAG_URL: ${GRAPHRAG_URL:-}

  graphrag:
    profiles: ["graphrag"]
    build: ./graphrag
    container_name: nihongo-graphrag
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      GRAPHRAG_GRAPH: ${GRAPHRAG_GRAPH:-nihongo_rag}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GRAPHRAG_LLM_MODEL: ${GRAPHRAG_LLM_MODEL:-}
      GRAPHRAG_EMBED_MODEL: ${GRAPHRAG_EMBED_MODEL:-}
    expose: ["8010"]

volumes:
  falkordb_data:
